name = "booking-worker"
account_id = "a0c5e93c44c4e217f2b167fd0beb4b39"
main = "worker/src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Workers Logs: retain console.* output and invocation metadata (~7 days,
# queryable in the Cloudflare dashboard under Workers > booking-worker > Logs).
# Low-traffic worker, so sample every request.
[observability]
enabled = true
head_sampling_rate = 1

[vars]
OWNER_NAME = "Nils Eckelt"
OWNER_EMAIL = "nils@ecke.lt"
FEEDBACK_EMAIL = "feedback@nils.ecke.lt"
CALDAV_CALENDAR_NILS = "bd0ce304-f055-4524-9273-80a7d8cee9f1"
CALDAV_CALENDAR_OHANA = "0C692FAB-66C9-454F-B51D-D076560588DB"
JAAS_APP_ID = "vpaas-magic-cookie-844afece898c44fe995febd212d45364"
JAAS_KEY_ID = "98c2cb"
# Owner timezone guard: when travelling, set OWNER_TZ to your current IANA zone
# (e.g. "Asia/Bangkok", "America/New_York"). Slots stay in Berlin time for the
# booker but never fall outside your own OWNER_MIN_HOUR–OWNER_MAX_HOUR (24h,
# defaults 9–17). Ahead of Berlin trims your evening; behind trims your morning.
# Change it here + `wrangler deploy`, or edit the var in the Cloudflare UI.
OWNER_TZ = "Europe/Berlin"
OWNER_MIN_HOUR = "9"
OWNER_MAX_HOUR = "17"
# JAAS_PRIVATE_KEY: stored as Cloudflare Worker secret
# LINK_SIGNING_SECRET: stored as Cloudflare Worker secret — HMAC key for the
# signed cancel/reschedule/join links (query parameter `t`, see worker/src/links.ts).
# Set with: npx wrangler secret put LINK_SIGNING_SECRET

# Rate limiting (worker/src/index.ts, checkRateLimit): per-IP counters for
# /api/book (5/h) and /api/cancel (10/h).
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "1c475e7685ca4944a12dcc318f09ec91"

[[routes]]
pattern = "book.ecke.lt/api/*"
zone_name = "ecke.lt"

[[routes]]
pattern = "join.ecke.lt/*"
zone_name = "ecke.lt"

# feedback.ecke.lt — workshop/talk feedback form (worker/src/feedback.ts).
# Needs a proxied DNS record for "feedback" in the ecke.lt zone.
[[routes]]
pattern = "feedback.ecke.lt/*"
zone_name = "ecke.lt"
